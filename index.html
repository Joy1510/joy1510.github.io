<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joy1510 · GitHub dashboard</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2433;--mute:#667085;--line:#d9dfea;--accent:#3b5bdb;--warm:#f59f00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a26;--card:#1c2433;--ink:#e8ecf4;--mute:#97a1b5;--line:#2c3649;--accent:#7c95ff;--warm:#ffc247}}
:root[data-theme="dark"]{--bg:#141a26;--card:#1c2433;--ink:#e8ecf4;--mute:#97a1b5;--line:#2c3649;--accent:#7c95ff;--warm:#ffc247}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:980px;margin:0 auto;padding:28px 18px 56px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
header{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header img{width:84px;height:84px;border-radius:50%;border:3px solid var(--card);background:var(--line)}
h1{margin:0;font-size:1.9rem;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--mute);margin:2px 0 0}
.grow{flex:1;min-width:200px}
button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:26px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
h2{font-size:1.1rem;margin:0 0 12px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:var(--mute);font-size:.92rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input{flex:1;min-width:160px}
.repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.repo{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.repo h3{margin:0;font-size:1rem;word-break:break-all}
.repo p{margin:0;color:var(--mute);font-size:.92rem;flex:1;word-break:break-word}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:.85rem}
.tag{border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:.78rem;color:var(--mute);align-self:flex-start}
.note{padding:10px 14px;border-left:4px solid var(--warm);background:var(--card);border-radius:6px;margin:16px 0;font-size:.92rem}
.empty{color:var(--mute);padding:12px 0}
</style>
</head>
<body>
<main>
  <header>
    <img id="avatar" src="https://avatars.githubusercontent.com/u/38610110?v=4" alt="Profile photo of Joy1510">
    <div class="grow">
      <h1 id="name">Prasanto Dey</h1>
      <p class="sub"><a id="login" href="https://github.com/Joy1510">@Joy1510</a> <span id="bio"></span></p>
    </div>
    <button id="theme" type="button" aria-label="Switch between light and dark theme">Theme</button>
  </header>

  <div id="note" class="note" hidden></div>

  <section class="stats" aria-label="Profile numbers">
    <div class="stat"><b id="s-repos">8</b><span>Public repos</span></div>
    <div class="stat"><b id="s-stars">0</b><span>Stars earned</span></div>
    <div class="stat"><b id="s-followers">–</b><span>Followers</span></div>
    <div class="stat"><b id="s-langs">–</b><span>Languages</span></div>
  </section>

  <section class="panel">
    <h2>Languages across your repos</h2>
    <div class="bar" id="bar" role="img" aria-label="Language share by repo count"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel">
    <h2>Repositories</h2>
    <div class="tools">
      <input id="q" type="search" placeholder="Search repos" aria-label="Search repositories">
      <select id="lang" aria-label="Filter by language"><option value="">All languages</option></select>
      <select id="sort" aria-label="Sort repositories">
        <option value="updated">Recently updated</option>
        <option value="name">Name A–Z</option>
        <option value="stars">Most stars</option>
      </select>
    </div>
    <div class="repos" id="repos"></div>
  </section>
</main>

<script>
(function(){
  var USER = "Joy1510";
  var COLORS = {HTML:"#e34c26",JavaScript:"#f1c40f",CSS:"#7e57c2",Python:"#3572a5",TypeScript:"#3178c6",Java:"#b07219","C++":"#f34b7d",C:"#8a8a8a",PHP:"#6e7bb8",Other:"#98a2b3"};
  // Snapshot taken from the public profile. Used when the live GitHub API cannot be reached.
  var SNAPSHOT = {
    user:{name:"Prasanto Dey",login:USER,followers:null,bio:"",avatar_url:"https://avatars.githubusercontent.com/u/38610110?v=4",public_repos:8},
    repos:[
      {name:"joy1510.github.io",description:"",language:"HTML",stargazers_count:0,fork:false,updated_at:null,html_url:"https://github.com/Joy1510/joy1510.github.io"},
      {name:"Prasanto",description:"This is my second project.",language:"HTML",stargazers_count:0,fork:false,updated_at:null,html_url:"https://github.com/Joy1510/Prasanto"},
      {name:"CSE499-Group04-Online_Home_Repair_System",description:"Forked from sazzadhossain05/CSE499-Group04-Online_Home_Repair_System",language:"JavaScript",stargazers_count:0,fork:true,updated_at:null,html_url:"https://github.com/Joy1510/CSE499-Group04-Online_Home_Repair_System"},
      {name:"PrasantoDey",description:"",language:null,stargazers_count:0,fork:false,updated_at:null,html_url:"https://github.com/Joy1510/PrasantoDey"},
      {name:"initial",description:"",language:null,stargazers_count:0,fork:false,updated_at:null,html_url:"https://github.com/Joy1510/initial"},
      {name:"repo_101",description:"",language:null,stargazers_count:0,fork:false,updated_at:null,html_url:"https://github.com/Joy1510/repo_101"}
    ]
  };
  var $ = function(id){return document.getElementById(id)};
  var state = {repos:[],live:false};

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function color(l){return COLORS[l]||COLORS.Other}
  function ago(iso){
    if(!iso) return "";
    var d=Math.floor((Date.now()-new Date(iso))/864e5);
    if(d<1) return "updated today";
    if(d<30) return "updated "+d+" day"+(d>1?"s":"")+" ago";
    if(d<365) return "updated "+Math.floor(d/30)+" mo ago";
    return "updated "+Math.floor(d/365)+" yr ago";
  }

  function langCounts(repos){
    var m={};
    repos.forEach(function(r){if(r.language) m[r.language]=(m[r.language]||0)+1});
    return Object.keys(m).map(function(k){return {name:k,n:m[k]}}).sort(function(a,b){return b.n-a.n});
  }

  function renderProfile(u,repos){
    $("name").textContent=u.name||u.login;
    $("login").textContent="@"+u.login;
    $("login").href="https://github.com/"+u.login;
    $("bio").textContent=u.bio?" · "+u.bio:"";
    if(u.avatar_url) $("avatar").src=u.avatar_url;
    $("s-repos").textContent=u.public_repos!=null?u.public_repos:repos.length;
    $("s-stars").textContent=repos.reduce(function(a,r){return a+(r.stargazers_count||0)},0);
    $("s-followers").textContent=u.followers==null?"–":u.followers;
    var lc=langCounts(repos);
    $("s-langs").textContent=lc.length;
    var total=lc.reduce(function(a,l){return a+l.n},0)||1;
    $("bar").innerHTML=lc.map(function(l){return '<i style="width:'+(l.n/total*100)+'%;background:'+color(l.name)+'" title="'+esc(l.name)+'"></i>'}).join("");
    $("legend").innerHTML=lc.length?lc.map(function(l){return '<span><span class="dot" style="background:'+color(l.name)+'"></span>'+esc(l.name)+" ("+l.n+")</span>"}).join(""):'<span>No languages detected yet.</span>';
    var sel=$("lang"),cur=sel.value;
    sel.innerHTML='<option value="">All languages</option>'+lc.map(function(l){return '<option>'+esc(l.name)+'</option>'}).join("");
    sel.value=cur;
  }

  function renderRepos(){
    var q=$("q").value.toLowerCase(),lang=$("lang").value,sort=$("sort").value;
    var list=state.repos.filter(function(r){
      return (!lang||r.language===lang)&&(!q||(r.name+" "+(r.description||"")).toLowerCase().indexOf(q)>-1);
    });
    list.sort(function(a,b){
      if(sort==="name") return a.name.localeCompare(b.name);
      if(sort==="stars") return (b.stargazers_count||0)-(a.stargazers_count||0);
      return (b.updated_at||"").localeCompare(a.updated_at||"");
    });
    $("repos").innerHTML=list.length?list.map(function(r){
      return '<article class="repo"><h3><a href="'+esc(r.html_url)+'" target="_blank" rel="noopener">'+esc(r.name)+'</a></h3>'+
        (r.fork?'<span class="tag">Fork</span>':'')+
        '<p>'+esc(r.description||"No description yet.")+'</p>'+
        '<div class="meta">'+(r.language?'<span><span class="dot" style="background:'+color(r.language)+'"></span>'+esc(r.language)+'</span>':'')+
        '<span>★ '+(r.stargazers_count||0)+'</span>'+(r.updated_at?'<span>'+ago(r.updated_at)+'</span>':'')+'</div></article>';
    }).join(""):'<div class="empty">No repos match. Clear the search or pick another language.</div>';
  }

  function show(data,live){
    state.repos=data.repos;state.live=live;
    renderProfile(data.user,data.repos);renderRepos();
    var n=$("note");
    if(live){n.hidden=true}
    else{n.hidden=false;n.textContent="Showing a saved copy of your profile. When this page is hosted on GitHub Pages it loads your live data automatically, including followers, update dates and any repos not listed here.";}
  }

  function load(){
    show(SNAPSHOT,false);
    var base="https://api.github.com/users/"+USER;
    Promise.all([
      fetch(base).then(function(r){if(!r.ok) throw new Error(r.status);return r.json()}),
      fetch(base+"/repos?per_page=100&sort=updated").then(function(r){if(!r.ok) throw new Error(r.status);return r.json()})
    ]).then(function(res){show({user:res[0],repos:res[1]},true)})
      .catch(function(){/* keep snapshot */});
  }

  ["q","lang","sort"].forEach(function(id){$(id).addEventListener("input",renderRepos)});
  $("theme").addEventListener("click",function(){
    var root=document.documentElement;
    var dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    root.dataset.theme=dark?"light":"dark";
  });
  load();
})();
</script>
</body>
</html>
